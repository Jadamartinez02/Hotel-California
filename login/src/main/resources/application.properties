spring.application.name=login

# Local database for development and tests.
spring.datasource.url=jdbc:h2:mem:login;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
jwt.secret=hotelcalifornialogin
jwt.expiration=86400000

# Server Configuration
server.port=8080

security.jwt.key.private=d0cbd07c8f49a79663a333fce5c86fe0e0e2ab628b61380a798ab56b9e1ad4bf
security.jwt.user.generator=AUTHOJWT-BACKEND
